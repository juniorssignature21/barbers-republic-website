{% load static %}
<header>
    <!--? Header Start -->
    <div class="header-area header-transparent pt-20">
        <div class="main-header header-sticky">
            <div class="container-fluid">
                <div class="row align-items-center">
                    <!-- Logo -->
                    <div class="col-xl-2 col-lg-2 col-md-1">
                        <div class="logo">
                            <a href="index.html"><img src="{% static 'assets/img/logo/logo.png' %}" alt=""></a>
                        </div>
                    </div>
                    <div class="col-xl-10 col-lg-10 col-md-10">
                        <div class="menu-main d-flex align-items-center justify-content-end">
                            <!-- Main-menu -->
                            <div class="main-menu f-right d-none d-lg-block">
                                <nav>
                                    <ul id="navigation">
                                        <li class="active"><a href="{% url "app:index" %}">Home</a></li>
                                        <li><a href="{% url "app:about" %}">About</a></li>
                                        <li><a href="services.html">Services</a></li>
                                        <li><a href="portfolio.html">Portfolio</a></li>
                                        <li><a href="contact.html">Contact</a></li>
                                        {% if request.user.is_authenticated %}
                                        <li><a href="">
                                            <i class="fas fa-user"></i>
                                        </a>
                                            <ul class="submenu">
                                                <li><a href="blog.html">
                                                    View Profile
                                                </a></li>
                                                <li><a href="{% url "app:logout_user" %}">
                                                    Logout
                                                </a></li>
                                            </ul>
                                        </li>
                                        {% else %}
                                        <li><a href="blog.html">
                                            <i class="fas fa-user"></i>
                                        </a>
                                            <ul class="submenu">
                                                <li><a href="app:register_user">
                                                    Signup
                                                </a></li>
                                                <li><a href="app:login_user">
                                                    Login
                                                </a></li>
                                            </ul>
                                        </li>
                                        {% endif %}
                                    </ul>
                                </nav>
                            </div>
                            <div class="header-right-btn f-right d-none d-lg-block ml-30">
                                <a href="from.html" class="btn header-btn">became a member</a>
                            </div>
                        </div>
                    </div>   
                    <!-- Mobile Menu -->
                    <div class="col-12">
                        <div class="mobile_menu d-block d-lg-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Header End -->
</header>
